<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Meet Transcript</title>
  <link rel="stylesheet" href="../panel/panel.css">
  <style>
    /* Popup tak punya viewport sendiri: tanpa lebar eksplisit Chrome
       menyusutkannya sampai teks baris terpotong. */
    body { width: 228px; }

    header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid #ddd; }
    header img { width: 20px; height: 20px; }
    header b { font-weight: 600; }

    .rows { padding: 4px; }
    /* Baris menu, bukan tombol: tanpa border & latar, selebar popup, caret di
       tepi kanan. Tetap <button>/<summary> supaya keyboard & screen reader
       tahu ini bisa diklik. Menang atas `details.menu > summary` di panel.css
       lewat spesifisitas (.rows + .menu + summary). */
    .rows > button,
    .rows > .menu > summary { display: flex; align-items: center; gap: 8px;
      width: 100%; box-sizing: border-box; padding: 8px 10px; border: 0; border-radius: 6px;
      background: none; font: inherit; text-align: left; cursor: pointer; }
    .rows svg { width: 16px; height: 16px; flex: none; fill: none; stroke: #5f6368;
      stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    /* Titik rekam: satu-satunya ikon berisi, sewarna badge merekam. */
    .rows svg.solid { fill: #d93025; stroke: none; }
    /* Garis pemisah sebelum Riwayat: aksi yang meninggalkan popup ini menuju
       arsip, bukan bagian dari rekaman yang sedang berjalan. */
    .sep { height: 1px; background: #ddd; margin: 4px 10px; }
    .rows > button:hover,
    .rows > .menu > summary:hover { background: #f1f3f4; }
    .rows > button:focus-visible,
    .rows > .menu > summary:focus-visible { outline: 2px solid #1a73e8; outline-offset: -2px; }
    .rows > .menu[open] > summary { background: #f1f3f4; }
    /* Terbuka INLINE di bawah barisnya, bukan melayang: di panel.css menu ini
       position:absolute (di sidebar memang mengambang di atas transkrip), dan
       di popup selebar 228px apa pun yang melayang keluar lebar body akan
       terpotong. Static = popup tinggal memanjang ke bawah. */
    /* margin-left:auto — caret menempel ke tepi kanan, ikon & label tetap
       rapat di kiri (gap 8px). */
    .menu.inline > summary::after { content: '›'; color: #888; margin-left: auto; }
    .menu.inline[open] > summary::after { content: '⌄'; }
    .rows > .menu > .menu-list { position: static; min-width: 0; padding: 0;
      border: 0; border-radius: 0; box-shadow: none; background: none; }
    /* Indentasi kiri = penanda anak dari "Rekam"; tanpa itu dua item ini
       terbaca sejajar dengan "Tampilkan detail". */
    /* 34px = 10px padding baris + 16px ikon + 8px gap, jadi label anak lurus
       dengan label induknya. Judul meeting bisa sepanjang apa pun — dipotong
       dengan elipsis, bukan dibiarkan melebarkan popup. */
    .rows > .menu > .menu-list > button { display: block; padding: 8px 10px 8px 34px; border-radius: 6px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rows > .menu > .menu-list > .muted { padding: 6px 10px 6px 34px; font-size: inherit; }
    .rows > .menu > .menu-list > button:focus-visible { outline: 2px solid #1a73e8; outline-offset: -2px; }
    .rows .state { padding: 2px 10px 6px; }
    .rows .err { padding: 2px 10px 6px; }
  </style>
</head>
<body>
  <header>
    <img src="../icons/icon48.png" alt="">
    <b>Meet Transcript</b>
  </header>
  <div class="rows" id="view"></div>
  <script src="../lib/ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
